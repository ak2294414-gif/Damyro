<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NexusAI — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    --forest-deep:   #0d1f15;
    --forest-dark:   #132b1a;
    --forest-mid:    #1e4028;
    --forest-green:  #2d5e3a;
    --moss:          #4a7c59;
    --mist:          #7aab8a;
    --foam:          #b2d4bc;
    --sky-pale:      #c8dfe8;
    --water-blue:    #6a9cb0;
    --cascade-white: #e8f2ec;
    --pure:          #ffffff;
    --gold-accent:   #c9a84c;
    --text-primary:  #e8f2ec;
    --text-muted:    #7aab8a;
    --card-bg:       rgba(19,43,26,0.85);
    --border:        rgba(178,212,188,0.15);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; font-family:"Inter",sans-serif;
    background: linear-gradient(160deg, var(--forest-deep) 0%, #0a1a10 40%, #071510 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--text-primary); position:relative; overflow:hidden;
  }

  /* Ambient background */
  .bg-glow {
    position:fixed; inset:0; pointer-events:none;
    background:
      radial-gradient(ellipse 70% 50% at 30% 20%, rgba(45,94,58,0.18) 0%, transparent 60%),
      radial-gradient(ellipse 50% 60% at 80% 70%, rgba(106,156,176,0.12) 0%, transparent 60%);
  }
  .bg-lines {
    position:fixed; inset:0; pointer-events:none;
    background-image: repeating-linear-gradient(
      90deg, rgba(178,212,188,0.03) 0px, rgba(178,212,188,0.03) 1px, transparent 1px, transparent 80px
    );
  }

  /* Back link */
  .back-link {
    position:fixed; top:1.5rem; left:1.5rem;
    display:flex; align-items:center; gap:0.5rem;
    color:var(--mist); text-decoration:none; font-size:0.85rem;
    letter-spacing:0.05em; transition:color 0.2s;
    z-index:50;
  }
  .back-link:hover { color:var(--foam); }

  /* Logo top */
  .logo-bar {
    position:relative; z-index:10;
    display:flex; flex-direction:column; align-items:center;
    margin-bottom:2rem; animation: fadeDown 0.8s ease both;
  }
  .logo-icon {
    width:56px; height:56px;
    background: linear-gradient(135deg, var(--moss), var(--water-blue));
    border-radius:16px; display:flex; align-items:center; justify-content:center;
    font-size:1.6rem; margin-bottom:0.6rem;
    box-shadow: 0 0 30px rgba(74,124,89,0.4);
    border:1px solid var(--border);
  }
  .logo-name {
    font-family:"Cormorant Garamond",serif; font-size:1.8rem;
    font-weight:300; letter-spacing:0.15em; color:var(--pure);
  }

  /* Card */
  .login-card {
    position:relative; z-index:10;
    width:min(420px, 92vw);
    background: var(--card-bg);
    border:1px solid var(--border);
    border-radius:24px;
    padding:2.5rem 2.2rem;
    backdrop-filter:blur(20px);
    box-shadow: 0 32px 64px rgba(0,0,0,0.4), 0 0 0 1px rgba(178,212,188,0.05);
    animation: fadeUp 0.9s 0.2s ease both;
  }
  .card-title {
    font-family:"Cormorant Garamond",serif;
    font-size:1.9rem; font-weight:300;
    color:var(--pure); text-align:center; margin-bottom:0.4rem;
  }
  .card-subtitle {
    text-align:center; color:var(--mist);
    font-size:0.85rem; margin-bottom:2rem; line-height:1.6;
  }

  /* Divider */
  .divider {
    display:flex; align-items:center; gap:0.8rem;
    margin:1.5rem 0; color:var(--mist); font-size:0.75rem;
    letter-spacing:0.1em; text-transform:uppercase;
  }
  .divider::before, .divider::after {
    content:''; flex:1; height:1px; background:var(--border);
  }

  /* Gmail Button */
  .btn-gmail {
    width:100%; padding:1rem 1.5rem;
    display:flex; align-items:center; justify-content:center; gap:0.9rem;
    background: linear-gradient(135deg, rgba(45,94,58,0.6), rgba(106,156,176,0.3));
    border:1px solid rgba(178,212,188,0.25);
    border-radius:14px; color:var(--pure);
    font-size:0.95rem; font-weight:500; letter-spacing:0.04em;
    cursor:pointer; transition:all 0.3s ease;
    text-decoration:none;
  }
  .btn-gmail:hover {
    background: linear-gradient(135deg, var(--forest-green), var(--water-blue));
    border-color:rgba(178,212,188,0.4);
    transform:translateY(-2px);
    box-shadow:0 8px 24px rgba(45,94,58,0.4);
  }
  .gmail-icon { width:22px; height:22px; flex-shrink:0; }

  /* OR section — manual email */
  .form-group { margin-bottom:1rem; }
  .form-label {
    display:block; font-size:0.78rem; letter-spacing:0.08em;
    text-transform:uppercase; color:var(--mist); margin-bottom:0.5rem;
  }
  .form-input {
    width:100%; padding:0.85rem 1.1rem;
    background:rgba(13,31,21,0.6);
    border:1px solid var(--border); border-radius:12px;
    color:var(--text-primary); font-size:0.95rem; font-family:"Inter",sans-serif;
    transition:border-color 0.2s, box-shadow 0.2s; outline:none;
  }
  .form-input::placeholder { color:rgba(122,171,138,0.5); }
  .form-input:focus {
    border-color:var(--moss);
    box-shadow:0 0 0 3px rgba(74,124,89,0.2);
  }

  .btn-signin {
    width:100%; padding:1rem;
    background: linear-gradient(135deg, var(--forest-green), var(--water-blue));
    border:none; border-radius:14px;
    color:var(--pure); font-size:0.95rem; font-weight:600;
    letter-spacing:0.06em; cursor:pointer;
    transition:all 0.3s ease; margin-top:0.5rem;
  }
  .btn-signin:hover {
    transform:translateY(-2px);
    box-shadow:0 8px 28px rgba(45,94,58,0.5);
  }

  /* Notice */
  .privacy-note {
    text-align:center; font-size:0.72rem;
    color:rgba(122,171,138,0.6); margin-top:1.2rem; line-height:1.6;
  }
  .privacy-note a { color:var(--mist); text-decoration:none; }

  /* Toast */
  .toast {
    position:fixed; bottom:2rem; left:50%; transform:translateX(-50%) translateY(100px);
    background:var(--forest-green); color:var(--pure);
    padding:0.8rem 1.8rem; border-radius:50px;
    font-size:0.88rem; font-weight:500;
    box-shadow:0 8px 24px rgba(0,0,0,0.3);
    transition:transform 0.4s ease; z-index:999;
  }
  .toast.show { transform:translateX(-50%) translateY(0); }

  @keyframes fadeDown {
    from { opacity:0; transform:translateY(-20px); }
    to   { opacity:1; transform:translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(30px); }
    to   { opacity:1; transform:translateY(0); }
  }
</style>
</head>
<body>

<div class="bg-glow"></div>
<div class="bg-lines"></div>

<a href="index.html" class="back-link">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
    <path d="M19 12H5M12 19l-7-7 7-7"/>
  </svg>
  Back
</a>

<!-- Logo -->
<div class="logo-bar">
  <div class="logo-icon">🌿</div>
  <div class="logo-name">NexusAI</div>
</div>

<!-- Card -->
<div class="login-card">
  <h2 class="card-title">Welcome Back</h2>
  <p class="card-subtitle">Sign in to access your dashboard and book appointments.</p>

  <!-- Gmail OAuth -->
  <button class="btn-gmail" onclick="signInWithGoogle()">
    <svg class="gmail-icon" viewBox="0 0 24 24">
      <path fill="#EA4335" d="M5.26620003,9.76452941 C6.19878754,6.93863203 8.85444915,4.90909091 12,4.90909091 C13.6909091,4.90909091 15.2181818,5.50909091 16.4181818,6.49090909 L19.9090909,3 C17.7818182,1.14545455 15.0545455,0 12,0 C7.27006974,0 3.1977497,2.69829785 1.23999023,6.65002441 L5.26620003,9.76452941 Z"/>
      <path fill="#34A853" d="M16.0407269,18.0125889 C14.9509167,18.7163016 13.5660892,19.0909091 12,19.0909091 C8.86648613,19.0909091 6.21911939,17.076871 5.27698177,14.2678769 L1.23746264,17.3349879 C3.19279051,21.2936293 7.26500293,24 12,24 C14.9328362,24 17.7353462,22.9573905 19.834192,20.9995801 L16.0407269,18.0125889 Z"/>
      <path fill="#4A90E2" d="M19.834192,20.9995801 C22.0291676,18.9520994 23.4545455,15.903663 23.4545455,12 C23.4545455,11.2909091 23.3454545,10.5272727 23.1818182,9.81818182 L12,9.81818182 L12,14.4545455 L18.4363636,14.4545455 C18.1187732,16.013626 17.2662994,17.2212117 16.0407269,18.0125889 L19.834192,20.9995801 Z"/>
      <path fill="#FBBC05" d="M5.27698177,14.2678769 C5.03832634,13.556323 4.90909091,12.7937589 4.90909091,12 C4.90909091,11.2182781 5.03443647,10.4668121 5.26620003,9.76452941 L1.23999023,6.65002441 C0.43658717,8.26043162 0,10.0753848 0,12 C0,13.9195484 0.444780743,15.7301709 1.23746264,17.3349879 L5.27698177,14.2678769 Z"/>
    </svg>
    Continue with Google / Gmail
  </button>

  <div class="divider">or sign in with email</div>

  <div class="form-group">
    <label class="form-label">Email Address</label>
    <input type="email" id="emailInput" class="form-input" placeholder="yourname@gmail.com"/>
  </div>
  <div class="form-group">
    <label class="form-label">Full Name</label>
    <input type="text" id="nameInput" class="form-input" placeholder="Your full name"/>
  </div>
  <button class="btn-signin" onclick="signInWithEmail()">Sign In & Continue</button>

  <p class="privacy-note">
    By signing in, you agree to our <a href="#">Privacy Policy</a>.<br/>
    Your data is encrypted and never shared.
  </p>
</div>

<div class="toast" id="toast"></div>

<script>
  // ── Firebase Config ─────────────────────────────────────
  // IMPORTANT: Replace with your own Firebase project config
  const FIREBASE_CONFIG = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  function showToast(msg, duration=2800) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), duration);
  }

  function saveUserAndRedirect(name, email) {
    const userData = { name, email, loginTime: new Date().toISOString() };
    localStorage.setItem("nexusai_user", JSON.stringify(userData));
    showToast("✅ Signed in! Redirecting...");
    setTimeout(() => { window.location.href = "questionnaire.html"; }, 1200);
  }

  function signInWithGoogle() {
    // In production: use Firebase Google Auth
    // For demo: prompt for details
    const email = prompt("Enter your Gmail address:");
    if (!email || !email.includes("@")) { showToast("❌ Please enter a valid Gmail."); return; }
    const name = prompt("Enter your full name:");
    if (!name) { showToast("❌ Name is required."); return; }
    saveUserAndRedirect(name.trim(), email.trim().toLowerCase());
  }

  function signInWithEmail() {
    const email = document.getElementById("emailInput").value.trim();
    const name  = document.getElementById("nameInput").value.trim();
    if (!email || !email.includes("@")) { showToast("❌ Enter a valid email."); return; }
    if (!name) { showToast("❌ Enter your name."); return; }
    saveUserAndRedirect(name, email.toLowerCase());
  }

  // If already logged in, skip to questionnaire
  if (localStorage.getItem("nexusai_user")) {
    const u = JSON.parse(localStorage.getItem("nexusai_user"));
    if (u && u.email) window.location.href = "questionnaire.html";
  }
</script>
</body>
</html>
