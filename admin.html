<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NexusAI — Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    --forest-deep:   #0d1f15;
    --forest-dark:   #132b1a;
    --forest-mid:    #1e4028;
    --forest-green:  #2d5e3a;
    --moss:          #4a7c59;
    --mist:          #7aab8a;
    --foam:          #b2d4bc;
    --sky-pale:      #c8dfe8;
    --water-blue:    #6a9cb0;
    --cascade-white: #e8f2ec;
    --pure:          #ffffff;
    --gold-accent:   #c9a84c;
    --text-primary:  #e8f2ec;
    --card-bg:       rgba(19,43,26,0.82);
    --border:        rgba(178,212,188,0.15);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { min-height:100vh; font-family:"Inter",sans-serif; background:linear-gradient(160deg,var(--forest-deep) 0%,#071510 100%); color:var(--text-primary); }
  .bg-glow { position:fixed; inset:0; pointer-events:none; background:radial-gradient(ellipse 60% 50% at 20% 30%,rgba(45,94,58,0.15) 0%,transparent 65%); }

  /* ── AUTH OVERLAY ── */
  .auth-overlay { position:fixed; inset:0; background:rgba(7,21,16,0.97); z-index:9999; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:1.5rem; }
  .auth-card { background:var(--card-bg); border:1px solid var(--border); border-radius:22px; padding:2.5rem 2rem; width:min(380px,92vw); backdrop-filter:blur(20px); text-align:center; }
  .auth-icon { font-size:2.5rem; margin-bottom:0.8rem; }
  .auth-title { font-family:"Cormorant Garamond",serif; font-size:2rem; font-weight:300; color:var(--pure); margin-bottom:0.5rem; }
  .auth-sub { color:var(--mist); font-size:0.85rem; margin-bottom:1.5rem; }
  .auth-input { width:100%; padding:0.9rem 1.1rem; background:rgba(13,31,21,0.7); border:1px solid var(--border); border-radius:12px; color:var(--text-primary); font-size:1rem; font-family:"Inter",sans-serif; outline:none; text-align:center; letter-spacing:0.2em; margin-bottom:1rem; transition:border-color 0.2s; }
  .auth-input:focus { border-color:var(--moss); }
  .auth-btn { width:100%; padding:0.9rem; background:linear-gradient(135deg,var(--forest-green),var(--water-blue)); border:none; border-radius:12px; color:var(--pure); font-size:0.95rem; font-weight:600; cursor:pointer; transition:all 0.3s; }
  .auth-btn:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(45,94,58,0.45); }
  .auth-error { color:#e87070; font-size:0.82rem; margin-top:0.5rem; }
  .auth-hint { color:rgba(122,171,138,0.5); font-size:0.72rem; margin-top:0.5rem; }

  /* ── NAV ── */
  .nav { position:sticky; top:0; z-index:100; display:flex; align-items:center; justify-content:space-between; padding:1rem 2rem; background:rgba(13,31,21,0.92); border-bottom:1px solid var(--border); backdrop-filter:blur(16px); }
  .nav-logo { display:flex; align-items:center; gap:0.7rem; }
  .nav-icon { width:36px; height:36px; background:linear-gradient(135deg,var(--moss),var(--water-blue)); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:1rem; }
  .nav-name { font-family:"Cormorant Garamond",serif; font-size:1.3rem; font-weight:300; letter-spacing:0.12em; }
  .admin-badge { background:rgba(201,168,76,0.15); border:1px solid rgba(201,168,76,0.3); color:var(--gold-accent); font-size:0.72rem; font-weight:600; letter-spacing:0.12em; text-transform:uppercase; padding:0.3rem 0.8rem; border-radius:50px; }
  .logout-nav { background:none; border:1px solid var(--border); border-radius:8px; color:var(--mist); font-size:0.8rem; padding:0.4rem 0.9rem; cursor:pointer; transition:all 0.2s; }
  .logout-nav:hover { border-color:#b05555; color:#e87070; }

  /* ── MAIN ── */
  .main { max-width:1100px; margin:0 auto; padding:2rem; position:relative; z-index:10; }
  .page-title { font-family:"Cormorant Garamond",serif; font-size:2.2rem; font-weight:300; color:var(--pure); margin-bottom:0.3rem; }
  .page-sub { color:var(--mist); font-size:0.88rem; margin-bottom:2rem; }

  /* Stats */
  .stats-row { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:1rem; margin-bottom:2rem; }
  .stat-card { background:var(--card-bg); border:1px solid var(--border); border-radius:16px; padding:1.2rem 1.4rem; backdrop-filter:blur(16px); }
  .stat-label { font-size:0.7rem; letter-spacing:0.1em; text-transform:uppercase; color:var(--mist); margin-bottom:0.5rem; }
  .stat-value { font-size:1.8rem; font-weight:700; color:var(--pure); }
  .stat-sub { font-size:0.72rem; color:var(--mist); margin-top:0.2rem; }

  /* Filter tabs */
  .filter-tabs { display:flex; gap:0.5rem; margin-bottom:1.5rem; flex-wrap:wrap; }
  .tab { padding:0.5rem 1.2rem; border-radius:50px; font-size:0.82rem; font-weight:500; cursor:pointer; border:1px solid var(--border); color:var(--mist); background:transparent; transition:all 0.2s; }
  .tab.active { background:rgba(45,94,58,0.35); border-color:var(--moss); color:var(--cascade-white); }
  .tab:hover:not(.active) { border-color:var(--mist); color:var(--foam); }

  /* Booking rows */
  .booking-row { background:var(--card-bg); border:1px solid var(--border); border-radius:18px; padding:1.5rem; margin-bottom:1rem; backdrop-filter:blur(16px); transition:border-color 0.2s; }
  .booking-row:hover { border-color:rgba(178,212,188,0.28); }
  .row-top { display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:1rem; margin-bottom:1rem; }
  .row-id { font-size:0.68rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--mist); margin-bottom:0.3rem; }
  .row-name { font-size:1.1rem; font-weight:500; color:var(--pure); }
  .row-pkg { font-size:0.82rem; color:var(--mist); margin-top:0.2rem; }

  .status-badge { display:inline-flex; align-items:center; gap:0.4rem; padding:0.4rem 0.9rem; border-radius:50px; font-size:0.75rem; font-weight:600; }
  .status-badge.pending { background:rgba(201,168,76,0.12); border:1px solid rgba(201,168,76,0.3); color:var(--gold-accent); }
  .status-badge.accepted { background:rgba(74,124,89,0.18); border:1px solid rgba(74,124,89,0.35); color:var(--mist); }
  .status-dot { width:6px; height:6px; border-radius:50%; }
  .status-badge.pending .status-dot { background:var(--gold-accent); }
  .status-badge.accepted .status-dot { background:var(--moss); }

  .row-details { display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:0.8rem; margin-bottom:1.2rem; }
  .detail-item { }
  .detail-label { font-size:0.67rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--mist); margin-bottom:0.25rem; }
  .detail-value { font-size:0.85rem; color:var(--foam); word-break:break-word; }

  /* Features pill list */
  .features-list { display:flex; flex-wrap:wrap; gap:0.4rem; margin-bottom:1rem; }
  .feature-pill { padding:0.25rem 0.7rem; background:rgba(74,124,89,0.15); border:1px solid rgba(74,124,89,0.25); border-radius:50px; font-size:0.72rem; color:var(--mist); }

  /* Accept controls */
  .accept-controls { background:rgba(13,31,21,0.5); border:1px solid rgba(74,124,89,0.2); border-radius:14px; padding:1.2rem; display:flex; flex-wrap:wrap; align-items:center; gap:1rem; }
  .control-label { font-size:0.75rem; letter-spacing:0.08em; text-transform:uppercase; color:var(--mist); margin-bottom:0.4rem; }
  .time-input { padding:0.65rem 0.9rem; background:rgba(13,31,21,0.7); border:1px solid var(--border); border-radius:10px; color:var(--text-primary); font-size:0.88rem; font-family:"Inter",sans-serif; outline:none; transition:border-color 0.2s; }
  .time-input:focus { border-color:var(--moss); }
  .meet-input { padding:0.65rem 0.9rem; background:rgba(13,31,21,0.7); border:1px solid var(--border); border-radius:10px; color:var(--text-primary); font-size:0.88rem; font-family:"Inter",sans-serif; outline:none; width:100%; max-width:300px; }
  .meet-input::placeholder { color:rgba(122,171,138,0.4); }
  .btn-accept { padding:0.7rem 1.6rem; background:linear-gradient(135deg,var(--forest-green),var(--water-blue)); border:none; border-radius:10px; color:var(--pure); font-size:0.85rem; font-weight:600; cursor:pointer; transition:all 0.3s; white-space:nowrap; }
  .btn-accept:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(45,94,58,0.45); }
  .btn-reject { padding:0.7rem 1.2rem; background:rgba(176,85,85,0.12); border:1px solid rgba(176,85,85,0.25); border-radius:10px; color:#e87070; font-size:0.85rem; cursor:pointer; transition:all 0.3s; }
  .btn-reject:hover { background:rgba(176,85,85,0.2); }

  .accepted-info { background:rgba(45,94,58,0.15); border:1px solid rgba(74,124,89,0.3); border-radius:12px; padding:1rem 1.2rem; font-size:0.85rem; color:var(--foam); }

  /* Empty */
  .empty-state { text-align:center; padding:3.5rem; background:var(--card-bg); border:1px solid var(--border); border-radius:20px; }
  .empty-icon { font-size:3rem; margin-bottom:1rem; opacity:0.6; }
  .empty-title { font-family:"Cormorant Garamond",serif; font-size:1.5rem; color:var(--foam); }
  .empty-desc { color:var(--mist); font-size:0.85rem; margin-top:0.5rem; }

  /* Toast */
  .toast { position:fixed; bottom:2rem; right:2rem; transform:translateX(200%); background:var(--forest-green); color:var(--pure); padding:0.8rem 1.5rem; border-radius:12px; font-size:0.85rem; font-weight:500; box-shadow:0 8px 24px rgba(0,0,0,0.3); transition:transform 0.4s ease; z-index:999; }
  .toast.show { transform:translateX(0); }

  @media(max-width:600px) { .main{padding:1rem;} .row-details{grid-template-columns:1fr 1fr;} }
</style>
</head>
<body>
<div class="bg-glow"></div>

<!-- AUTH OVERLAY -->
<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <div class="auth-icon">🔐</div>
    <div class="auth-title">Admin Access</div>
    <p class="auth-sub">Enter the admin passcode to continue.</p>
    <input type="password" class="auth-input" id="passcodeInput" placeholder="••••••••" onkeydown="if(event.key==='Enter')checkPasscode()"/>
    <button class="auth-btn" onclick="checkPasscode()">Enter Panel</button>
    <div class="auth-error" id="authError"></div>
    <div class="auth-hint">Default passcode: nexusadmin2024</div>
  </div>
</div>

<!-- NAV -->
<nav class="nav">
  <div class="nav-logo">
    <div class="nav-icon">🌿</div>
    <span class="nav-name">NexusAI</span>
    <span class="admin-badge">Admin</span>
  </div>
  <div style="display:flex;align-items:center;gap:1rem;">
    <span style="font-size:0.8rem;color:var(--mist)">Creator Panel</span>
    <button class="logout-nav" onclick="adminLogout()">Sign Out</button>
  </div>
</nav>

<!-- MAIN -->
<main class="main">
  <h1 class="page-title">Appointment Management</h1>
  <p class="page-sub">View and manage all customer booking requests in real-time.</p>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-card"><div class="stat-label">Total Requests</div><div class="stat-value" id="aTotal">0</div></div>
    <div class="stat-card"><div class="stat-label">Pending</div><div class="stat-value" style="color:var(--gold-accent)" id="aPending">0</div></div>
    <div class="stat-card"><div class="stat-label">Accepted</div><div class="stat-value" style="color:var(--mist)" id="aAccepted">0</div></div>
    <div class="stat-card"><div class="stat-label">This Week</div><div class="stat-value" id="aWeek">0</div></div>
  </div>

  <!-- Filter -->
  <div class="filter-tabs">
    <button class="tab active" onclick="filterBookings('all',this)">All</button>
    <button class="tab" onclick="filterBookings('pending',this)">Pending</button>
    <button class="tab" onclick="filterBookings('accepted',this)">Accepted</button>
  </div>

  <!-- Bookings list -->
  <div id="adminBookingsList"></div>
</main>

<div class="toast" id="toast"></div>

<script>
  const ADMIN_PASS = "nexusadmin2024"; // Change this to your own passcode
  const FIREBASE_DB = "https://YOUR_PROJECT-default-rtdb.firebaseio.com";

  let currentFilter = "all";

  // ── Auth ──
  function checkPasscode() {
    const val = document.getElementById("passcodeInput").value;
    if (val === ADMIN_PASS) {
      document.getElementById("authOverlay").style.display = "none";
      sessionStorage.setItem("nexusai_admin", "1");
      loadBookings();
      setInterval(loadBookings, 15000);
    } else {
      document.getElementById("authError").textContent = "❌ Incorrect passcode. Try again.";
      document.getElementById("passcodeInput").value = "";
      document.getElementById("passcodeInput").focus();
    }
  }
  function adminLogout() {
    sessionStorage.removeItem("nexusai_admin");
    document.getElementById("authOverlay").style.display = "flex";
  }
  if (sessionStorage.getItem("nexusai_admin") === "1") {
    document.getElementById("authOverlay").style.display = "none";
    loadBookings();
    setInterval(loadBookings, 15000);
  }

  function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2800);
  }

  // ── Load bookings from localStorage + Firebase ──
  async function loadBookings() {
    let bookings = JSON.parse(localStorage.getItem("nexusai_bookings") || "{}");

    // Try Firebase
    try {
      const res = await fetch(`${FIREBASE_DB}/bookings.json`);
      const data = await res.json();
      if (data) {
        bookings = Object.assign({}, bookings, data);
        localStorage.setItem("nexusai_bookings", JSON.stringify(bookings));
      }
    } catch(e) { /* Firebase not configured */ }

    const allArr = Object.values(bookings);
    document.getElementById("aTotal").textContent    = allArr.length;
    document.getElementById("aPending").textContent  = allArr.filter(b=>b.status==="pending").length;
    document.getElementById("aAccepted").textContent = allArr.filter(b=>b.status==="accepted").length;

    const weekAgo = Date.now() - 7*24*60*60*1000;
    document.getElementById("aWeek").textContent = allArr.filter(b=>new Date(b.submittedAt).getTime() > weekAgo).length;

    renderAdminList(bookings);
  }

  function filterBookings(filter, el) {
    currentFilter = filter;
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    el.classList.add("active");
    const bookings = JSON.parse(localStorage.getItem("nexusai_bookings") || "{}");
    renderAdminList(bookings);
  }

  function renderAdminList(bookings) {
    const container = document.getElementById("adminBookingsList");
    let arr = Object.values(bookings);
    arr.sort((a,b) => new Date(b.submittedAt) - new Date(a.submittedAt));

    if (currentFilter !== "all") arr = arr.filter(b=>b.status===currentFilter);

    if (arr.length === 0) {
      container.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div><div class="empty-title">No requests</div><div class="empty-desc">No ${currentFilter === "all" ? "" : currentFilter} booking requests yet.</div></div>`;
      return;
    }

    container.innerHTML = arr.map(b => renderAdminCard(b)).join("");
  }

  function renderAdminCard(b) {
    const qa = b.questionnaire || {};
    const c  = b.customer || {};
    const date = new Date(b.submittedAt).toLocaleString("en-IN");
    const isAccepted = b.status === "accepted";
    const statusBadge = isAccepted
      ? `<span class="status-badge accepted"><span class="status-dot"></span>Accepted</span>`
      : `<span class="status-badge pending"><span class="status-dot"></span>Pending</span>`;

    const featuresHtml = (qa.features||[]).map(f=>`<span class="feature-pill">${f}</span>`).join("");

    const controls = isAccepted
      ? `<div class="accepted-info">
          ✅ <strong>Confirmed.</strong> Meeting time: ${b.assignedTime || "—"}&nbsp;|&nbsp;
          Meet: ${b.meetLink ? `<a href="${b.meetLink}" target="_blank" style="color:var(--water-blue)">Open Link</a>` : "—"}
        </div>`
      : `<div class="accept-controls">
          <div>
            <div class="control-label">Call Date & Time</div>
            <input type="datetime-local" class="time-input" id="time_${b.id}"/>
          </div>
          <div>
            <div class="control-label">Google Meet Link</div>
            <input type="url" class="meet-input" id="meet_${b.id}" placeholder="https://meet.google.com/..."/>
          </div>
          <button class="btn-accept" onclick="acceptBooking('${b.id}')">✓ Accept & Confirm</button>
          <button class="btn-reject" onclick="rejectBooking('${b.id}')">✕ Decline</button>
        </div>`;

    return `
      <div class="booking-row" id="row_${b.id}">
        <div class="row-top">
          <div>
            <div class="row-id">ID: ${b.id}</div>
            <div class="row-name">${c.name||"Unknown"} · ${c.businessName||"—"}</div>
            <div class="row-pkg">${b.package||"—"} Package &middot; ${date}</div>
          </div>
          ${statusBadge}
        </div>
        <div class="row-details">
          <div class="detail-item"><div class="detail-label">Email</div><div class="detail-value">${c.email||"—"}</div></div>
          <div class="detail-item"><div class="detail-label">Mobile</div><div class="detail-value">${c.mobile||"—"}</div></div>
          <div class="detail-item"><div class="detail-label">Location</div><div class="detail-value">${c.location||"—"}</div></div>
          <div class="detail-item"><div class="detail-label">Business Type</div><div class="detail-value">${qa.businessType||"—"}</div></div>
          <div class="detail-item"><div class="detail-label">Target Customer</div><div class="detail-value">${qa.targetCustomer||"—"}</div></div>
          <div class="detail-item"><div class="detail-label">Budget</div><div class="detail-value">${qa.budget||"—"}</div></div>
          <div class="detail-item"><div class="detail-label">Payment Method</div><div class="detail-value">${b.paymentMethod||"—"}</div></div>
          <div class="detail-item"><div class="detail-label">Language</div><div class="detail-value">${b.lang||"—"}</div></div>
        </div>
        ${featuresHtml ? `<div class="features-list">${featuresHtml}</div>` : ""}
        ${b.requirements ? `<div style="color:var(--mist);font-size:0.82rem;margin-bottom:1rem;line-height:1.6;padding:0.8rem 1rem;background:rgba(13,31,21,0.4);border-radius:10px;">📝 ${b.requirements}</div>` : ""}
        ${controls}
      </div>`;
  }

  async function acceptBooking(id) {
    const timeEl = document.getElementById(`time_${id}`);
    const meetEl = document.getElementById(`meet_${id}`);
    const time   = timeEl ? timeEl.value : "";
    const meet   = meetEl ? meetEl.value : "";

    if (!time) { showToast("⚠️ Please set a date & time first."); return; }

    const bookings = JSON.parse(localStorage.getItem("nexusai_bookings") || "{}");
    if (!bookings[id]) { showToast("❌ Booking not found."); return; }

    const formatted = new Date(time).toLocaleString("en-IN",{
      weekday:"long",year:"numeric",month:"long",day:"numeric",
      hour:"2-digit",minute:"2-digit"
    });

    bookings[id].status       = "accepted";
    bookings[id].assignedTime = formatted;
    bookings[id].meetLink     = meet || null;
    bookings[id].acceptedAt   = new Date().toISOString();
    localStorage.setItem("nexusai_bookings", JSON.stringify(bookings));

    // Sync to Firebase
    try {
      await fetch(`${FIREBASE_DB}/bookings/${id}.json`, {
        method:"PATCH",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          status:"accepted",
          assignedTime:formatted,
          meetLink:meet||null,
          acceptedAt:new Date().toISOString()
        })
      });
    } catch(e) { /* Firebase not configured */ }

    showToast("✅ Appointment accepted & confirmed!");
    setTimeout(loadBookings, 500);
  }

  async function rejectBooking(id) {
    if (!confirm("Decline this booking request?")) return;
    const bookings = JSON.parse(localStorage.getItem("nexusai_bookings") || "{}");
    if (bookings[id]) {
      bookings[id].status = "declined";
      localStorage.setItem("nexusai_bookings", JSON.stringify(bookings));
    }
    try {
      await fetch(`${FIREBASE_DB}/bookings/${id}.json`, {
        method:"PATCH",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({status:"declined"})
      });
    } catch(e) {}
    showToast("Booking declined.");
    setTimeout(loadBookings, 500);
  }
</script>
</body>
</html>
