<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WebKrafta — AI Agents for Your Business</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Supabase JS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
/* ═══════════ RESET & CUSTOM PROPERTIES ═══════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #060612; --bg2: #0a0a1a; --bg3: #0e0e22;
  --surface: rgba(255,255,255,0.04); --surface2: rgba(255,255,255,0.07);
  --border: rgba(255,255,255,0.08); --border2: rgba(255,255,255,0.14);
  --text: #e8e8f0; --text2: #9898b8; --text3: #5a5a7a;
  --violet: #7c3aed; --violet-light: #a855f7; --cyan: #06b6d4;
  --amber: #f59e0b; --emerald: #10b981; --rose: #f43f5e;
  --wa-green: #25d366;
  --font-body: 'Space Grotesk', sans-serif;
  --font-head: 'Syne', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
  --radius: 16px; --radius-sm: 8px; --radius-lg: 24px;
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  --spring: 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--violet); border-radius: 3px; }
html { scroll-behavior: smooth; }
body { font-family: var(--font-body); background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
body::before { content: ''; position: fixed; inset: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E"); pointer-events: none; z-index: 0; opacity: 0.5; }

/* ═══════════ UTILITIES ═══════════ */
.gradient-text { background: linear-gradient(135deg, var(--violet-light), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 14px; border-radius: 999px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 12px 24px; border-radius: var(--radius-sm); border: none; cursor: pointer; font-family: var(--font-body); font-size: 14px; font-weight: 600; transition: var(--transition); text-decoration: none; }
.btn-primary { background: linear-gradient(135deg, var(--violet), var(--cyan)); color: #fff; }
.btn-primary:hover { opacity: 0.88; transform: translateY(-1px); }
.btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border2); }
.btn-outline:hover { background: var(--surface2); border-color: var(--violet-light); }
.btn-wa { background: var(--wa-green); color: #fff; }
.btn-wa:hover { background: #1da851; transform: translateY(-1px); }
.btn-danger { background: rgba(244,63,94,0.15); color: var(--rose); border: 1px solid rgba(244,63,94,0.3); }
.btn-danger:hover { background: rgba(244,63,94,0.25); }
.section-label { font-family: var(--font-mono); font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--violet-light); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.section-label::before { content: ''; width: 24px; height: 1px; background: var(--violet-light); }
.glass { background: rgba(255,255,255,0.04); backdrop-filter: blur(20px); border: 1px solid var(--border2); }

/* ═══════════ NAV ═══════════ */
#nav { position: fixed; top: 0; left: 0; right: 0; height: 68px; z-index: 1000; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; background: rgba(6,6,18,0.7); backdrop-filter: blur(24px); border-bottom: 1px solid var(--border); transition: var(--transition); }
#nav-logo { font-family: var(--font-head); font-size: 22px; font-weight: 800; letter-spacing: -0.02em; background: linear-gradient(135deg, var(--violet-light), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; cursor: pointer; text-decoration: none; }
#nav-links { display: flex; align-items: center; gap: 4px; list-style: none; }
#nav-links a { color: var(--text2); text-decoration: none; font-size: 14px; font-weight: 500; padding: 8px 16px; border-radius: var(--radius-sm); transition: var(--transition); }
#nav-links a:hover { color: var(--text); background: var(--surface2); }
#nav-right { display: flex; align-items: center; gap: 10px; }
#btn-get-started { padding: 9px 20px; border-radius: var(--radius-sm); border: none; cursor: pointer; background: linear-gradient(135deg, var(--violet), var(--cyan)); color: #fff; font-family: var(--font-body); font-size: 13px; font-weight: 700; transition: var(--transition); }
#btn-get-started:hover { opacity: 0.85; transform: translateY(-1px); }
#hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 8px; background: none; border: none; }
#hamburger span { display: block; width: 22px; height: 2px; background: var(--text); border-radius: 1px; transition: var(--transition); }
#mobile-nav { display: none; position: fixed; top: 68px; left: 0; right: 0; z-index: 999; background: rgba(6,6,18,0.95); backdrop-filter: blur(24px); border-bottom: 1px solid var(--border); padding: 20px 24px; flex-direction: column; gap: 8px; }
#mobile-nav a { color: var(--text2); text-decoration: none; font-size: 15px; font-weight: 500; padding: 12px 0; display: block; border-bottom: 1px solid var(--border); transition: var(--transition); }
#mobile-nav a:hover { color: var(--text); }

/* ═══════════ PROMO BANNER ═══════════ */
#promo-banner { position: fixed; top: 0; left: 0; right: 0; z-index: 1001; min-height: 40px; display: none; align-items: center; justify-content: center; gap: 14px; background: linear-gradient(90deg, var(--violet), var(--cyan)); color: #fff; font-size: 13px; font-weight: 600; padding: 8px 48px 8px 16px; text-align: center; flex-wrap: wrap; }
#promo-banner-cta { padding: 4px 12px; border-radius: 999px; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.35); color: #fff; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; transition: var(--transition); font-family: var(--font-body); }
#promo-banner-cta:hover { background: rgba(255,255,255,0.32); }
#promo-banner-close { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #fff; opacity: 0.8; cursor: pointer; font-size: 15px; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
body.banner-active #nav { top: 40px; }
body.banner-active #mobile-nav { top: 108px; }
body.banner-active #hero { padding-top: 160px; }

/* ═══════════ HERO ═══════════ */
#hero { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 120px 32px 80px; position: relative; overflow: hidden; }
#hero-bg { position: absolute; inset: 0; z-index: -1; background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(124,58,237,0.15) 0%, transparent 70%), radial-gradient(ellipse 60% 40% at 80% 60%, rgba(6,182,212,0.08) 0%, transparent 60%); }
.hero-badge { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 28px; padding: 8px 20px; border-radius: 999px; border: 1px solid rgba(124,58,237,0.3); background: rgba(124,58,237,0.08); font-size: 13px; font-weight: 600; color: var(--violet-light); }
.hero-badge-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--violet-light); animation: pulse-dot 2s ease-in-out infinite; }
@keyframes pulse-dot { 0%,100% { box-shadow: 0 0 0 0 rgba(168,85,247,0.4); } 50% { box-shadow: 0 0 0 6px rgba(168,85,247,0); } }
#hero h1 { font-family: var(--font-head); font-size: clamp(40px, 6vw, 80px); font-weight: 800; line-height: 1.06; letter-spacing: -0.03em; max-width: 900px; margin-bottom: 24px; color: #fff; }
.hero-highlight { background: linear-gradient(135deg, var(--violet-light), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
#hero p { font-size: clamp(16px, 2.2vw, 20px); color: var(--text2); max-width: 600px; line-height: 1.65; margin-bottom: 40px; }
.hero-ctas { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-bottom: 72px; }
.hero-ctas .btn { font-size: 15px; padding: 14px 32px; }
.hero-stats { display: flex; gap: 48px; flex-wrap: wrap; justify-content: center; }
.stat-item { text-align: center; }
.stat-number { font-family: var(--font-head); font-size: clamp(28px, 4vw, 42px); font-weight: 800; background: linear-gradient(135deg, #fff, var(--text2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.stat-label { font-size: 13px; color: var(--text3); font-weight: 500; margin-top: 4px; }
.scroll-indicator { position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; color: var(--text3); font-size: 12px; animation: scroll-bounce 2.2s ease-in-out infinite; }
@keyframes scroll-bounce { 0%,100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(8px); } }

/* ═══════════ CAROUSEL ═══════════ */
#carousel-section { padding: 80px 0 40px; position: relative; }
.section-header { text-align: center; margin-bottom: 48px; padding: 0 32px; }
.section-header h2 { font-family: var(--font-head); font-size: clamp(32px, 4vw, 52px); font-weight: 800; letter-spacing: -0.02em; margin-bottom: 16px; }
.section-header p { color: var(--text2); font-size: 17px; max-width: 560px; margin: 0 auto; }
#carousel-wrapper { width: 100%; height: 600px; position: relative; overflow: hidden; cursor: grab; }
#carousel-wrapper:active { cursor: grabbing; }
#carousel-scene { width: 100%; height: 100%; perspective: 1200px; perspective-origin: 50% 50%; position: relative; }
#carousel-inner { width: 100%; height: 100%; transform-style: preserve-3d; position: relative; }
.agent-card { position: absolute; width: 190px; height: 190px; border-radius: var(--radius); cursor: pointer; transform-style: preserve-3d; backface-visibility: hidden; will-change: transform; left: 50%; top: 50%; margin-left: -95px; margin-top: -95px; }
.agent-card canvas { width: 100%; height: 100%; border-radius: var(--radius); display: block; }
.agent-card-overlay { position: absolute; inset: 0; border-radius: var(--radius); background: linear-gradient(180deg, transparent 38%, rgba(0,0,0,0.85) 100%); display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
.card-index-badge { position: absolute; top: 10px; left: 10px; width: 25px; height: 25px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 11px; font-weight: 700; color: #fff; }
.card-label-box { padding: 11px 14px 13px; border-top: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.03); }
.card-tier-label { font-family: var(--font-mono); font-size: 9px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 3px; }
.card-name { font-family: var(--font-head); font-size: 13px; font-weight: 700; color: #fff; line-height: 1.2; }

/* TOOLTIP */
#card-tooltip { position: fixed; z-index: 9999; pointer-events: none; padding: 12px 16px; border-radius: var(--radius-sm); background: rgba(10,10,26,0.96); border: 1px solid var(--border2); min-width: 200px; max-width: 240px; backdrop-filter: blur(16px); display: none; }
#card-tooltip .tt-tier { font-family: var(--font-mono); font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 4px; }
#card-tooltip .tt-name { font-weight: 700; font-size: 14px; margin-bottom: 6px; }
#card-tooltip .tt-row { font-size: 12px; color: var(--text2); margin-bottom: 2px; }
#card-tooltip .tt-row span { color: var(--text); font-weight: 600; }

/* ═══════════ CD / DISC ═══════════ */
#cd-anim-section { display: none; padding: 80px 0 40px; }
#cd-anim-section.active { display: block; }
#cd-stage { width: 100%; max-width: 900px; margin: 0 auto; position: relative; height: 520px; display: flex; align-items: center; justify-content: center; }
.cd-disc-wrapper { position: absolute; display: flex; align-items: center; justify-content: center; }
.cd-disc-ring { position: absolute; border-radius: 50%; border: 1px solid var(--border); animation: cd-ring-rotate linear infinite; }
@keyframes cd-ring-rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.cd-center-disc { width: 120px; height: 120px; border-radius: 50%; position: relative; z-index: 10; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-direction: column; }
.cd-center-disc::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(from 0deg, var(--violet), var(--cyan), var(--violet-light), var(--violet), var(--cyan)); animation: cd-spin 8s linear infinite; }
.cd-center-disc::after { content: ''; position: absolute; width: 30px; height: 30px; border-radius: 50%; background: var(--bg); z-index: 2; }
@keyframes cd-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.cd-card-item { position: absolute; width: 90px; height: 90px; border-radius: 14px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; overflow: hidden; transition: transform 0.2s ease; will-change: transform; }
.cd-card-item:hover { transform: scale(1.18) !important; z-index: 100 !important; }
.cd-card-item canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.cd-card-label { position: relative; z-index: 2; width: 100%; padding: 5px 6px 6px; background: linear-gradient(180deg, transparent, rgba(0,0,0,0.85)); text-align: center; }
.cd-card-label-tier { font-size: 8px; font-family: var(--font-mono); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
.cd-card-label-name { font-size: 8px; font-family: var(--font-head); font-weight: 700; color: #fff; }

/* ═══════════ ORBITAL ═══════════ */
#orbital-anim-section { display: none; padding: 80px 0 40px; }
#orbital-anim-section.active { display: block; }
#orbital-stage { width: 100%; max-width: 800px; margin: 0 auto; height: 500px; position: relative; perspective: 1000px; display: flex; align-items: center; justify-content: center; }
.orb-nucleus { width: 80px; height: 80px; border-radius: 50%; position: absolute; z-index: 20; background: radial-gradient(circle at 38% 38%, var(--violet-light), var(--violet)); box-shadow: 0 0 40px var(--violet); animation: orb-pulse 3s ease-in-out infinite; }
@keyframes orb-pulse { 0%,100% { box-shadow: 0 0 30px var(--violet); } 50% { box-shadow: 0 0 60px var(--violet-light); } }
.orb-ring-path { position: absolute; border-radius: 50%; border: 1px dashed rgba(255,255,255,0.1); animation: orb-ring-tilt linear infinite; display: flex; align-items: center; justify-content: center; }
@keyframes orb-ring-tilt { from { transform: rotateX(70deg) rotateZ(0deg); } to { transform: rotateX(70deg) rotateZ(360deg); } }
.orb-planet { position: absolute; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.orb-planet:hover { transform: scale(1.4); z-index: 50; }
.orb-planet canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.orb-planet-label { position: relative; z-index: 2; font-size: 9px; color: #fff; font-family: var(--font-mono); font-weight: 700; }

/* ═══════════ WHEEL ═══════════ */
#wheel-anim-section { display: none; padding: 80px 0 40px; }
#wheel-anim-section.active { display: block; }
#wheel-stage { width: 100%; max-width: 620px; margin: 0 auto; height: 560px; position: relative; display: flex; align-items: center; justify-content: center; }
#wheel-pointer { position: absolute; left: -6px; top: 50%; transform: translateY(-50%); z-index: 30; width: 0; height: 0; border-top: 14px solid transparent; border-bottom: 14px solid transparent; border-left: 22px solid var(--amber); filter: drop-shadow(0 0 8px rgba(245,158,11,0.7)); }
#wheel-rim { position: absolute; border-radius: 50%; width: 480px; height: 480px; background: repeating-conic-gradient(from 0deg, #7a5c1e 0deg 6deg, #f6d879 6deg 9deg, #b8860b 9deg 12deg); box-shadow: inset 0 0 0 14px #14141f, 0 0 50px rgba(245,158,11,0.25); will-change: transform; }
#wheel-hub { position: absolute; width: 96px; height: 96px; border-radius: 50%; z-index: 25; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-direction: column; background: radial-gradient(circle at 35% 30%, #fff6d8, #f6d879 35%, #b8860b 75%, #6b4e0e 100%); box-shadow: 0 0 0 4px #14141f, 0 0 24px rgba(245,158,11,0.6); transition: transform 0.2s ease; }
#wheel-hub:hover { transform: scale(1.06); }
#wheel-hub-label { font-family: var(--font-head); font-weight: 800; font-size: 11px; color: #2a1d05; position: relative; z-index: 2; }
#wheel-hub-sub { font-family: var(--font-mono); font-size: 8px; font-weight: 700; color: #4a3608; text-transform: uppercase; position: relative; z-index: 2; margin-top: 2px; }
.wheel-card-item { position: absolute; width: 84px; height: 84px; border-radius: 50%; cursor: pointer; overflow: hidden; display: flex; align-items: flex-end; justify-content: center; box-shadow: 0 0 0 3px #b8860b; transition: transform 0.2s ease; }
.wheel-card-item canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%; }
.wheel-card-label { position: relative; z-index: 2; width: 100%; padding: 3px 4px 4px; background: linear-gradient(180deg, transparent, rgba(0,0,0,0.9)); text-align: center; font-family: var(--font-mono); font-size: 7px; font-weight: 700; color: #fff; text-transform: uppercase; }
#wheel-status { text-align: center; font-size: 13px; color: var(--text3); margin-top: 16px; font-family: var(--font-mono); }
#wheel-detail-panel { max-width: 420px; margin: 24px auto 0; padding: 20px 22px; border-radius: var(--radius); display: none; background: rgba(184,134,11,0.08); border: 1px solid rgba(245,158,11,0.35); }
#wheel-detail-panel.active { display: block; }
#wheel-detail-tier { font-family: var(--font-mono); font-size: 11px; font-weight: 700; text-transform: uppercase; color: var(--amber); margin-bottom: 4px; }
#wheel-detail-name { font-family: var(--font-head); font-size: 19px; font-weight: 800; color: #fff; margin-bottom: 10px; }
#wheel-detail-rows { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--text2); }
#wheel-detail-rows span { color: var(--text); font-weight: 600; }
#wheel-detail-actions { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }

/* ═══════════ AGENT LIST ═══════════ */
#agent-list-section { padding: 10px 32px 90px; max-width: 980px; margin: 0 auto; }
.agent-list { display: flex; flex-direction: column; gap: 12px; }
.agent-list-row { display: grid; grid-template-columns: auto auto 1fr auto auto; align-items: center; gap: 18px; padding: 14px 20px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); border-left: 3px solid transparent; cursor: pointer; transition: var(--transition); }
.agent-list-row:hover { background: var(--surface2); transform: translateX(4px); box-shadow: 0 8px 24px rgba(0,0,0,0.25); }
.agent-list-index { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0; }
.agent-list-thumb { width: 46px; height: 46px; border-radius: 10px; overflow: hidden; flex-shrink: 0; }
.agent-list-thumb canvas { width: 100%; height: 100%; display: block; }
.agent-list-info { min-width: 0; }
.agent-list-name { font-family: var(--font-head); font-size: 15px; font-weight: 700; color: #fff; margin-bottom: 3px; }
.agent-list-tags { font-size: 12px; color: var(--text3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agent-list-pricing { text-align: right; font-family: var(--font-mono); flex-shrink: 0; }
.agent-list-monthly { font-size: 15px; font-weight: 700; color: #fff; }
.agent-list-setup { font-size: 11px; color: var(--text3); margin-top: 2px; }
.agent-list-arrow { color: var(--text3); font-size: 18px; flex-shrink: 0; transition: var(--transition); }
.agent-list-row:hover .agent-list-arrow { color: var(--violet-light); transform: translateX(3px); }

/* ═══════════ PREVIEW PANEL ═══════════ */
#preview-overlay { position: fixed; inset: 0; z-index: 2000; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; padding: 24px; }
#preview-overlay.active { display: flex; }
#preview-panel { background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--radius-lg); width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; position: relative; transform: scale(0.92) translateY(20px); opacity: 0; transition: var(--spring); }
#preview-panel.open { transform: scale(1) translateY(0); opacity: 1; }
.pp-canvas-header { width: 100%; height: 200px; border-radius: var(--radius-lg) var(--radius-lg) 0 0; overflow: hidden; position: relative; }
.pp-canvas-header canvas { width: 100%; height: 100%; display: block; }
.pp-canvas-header-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 40%, var(--bg2) 100%); }
.pp-close { position: absolute; top: 14px; right: 14px; z-index: 10; width: 36px; height: 36px; border-radius: 50%; background: rgba(0,0,0,0.6); border: 1px solid var(--border2); color: var(--text); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: var(--transition); }
.pp-close:hover { background: rgba(255,255,255,0.1); }
.pp-body { padding: 24px 28px 28px; }

.pp-agent-name { font-family: var(--font-head); font-size: 28px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 12px; color: #fff; }
.pp-description { color: var(--text2); font-size: 15px; line-height: 1.65; margin-bottom: 18px; }

.pp-benefit-item { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; font-size: 14px; color: var(--text2); line-height: 1.5; }

.pp-actions { display: flex; gap: 12px; }

/* ═══════════ DETAIL PAGE ═══════════ */
#detail-page { position: fixed; inset: 0; z-index: 3000; background: var(--bg); transform: translateX(100%); transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); overflow-y: auto; display: none; }
#detail-page.open { transform: translateX(0); }
#detail-back { position: fixed; top: 20px; left: 20px; z-index: 3001; display: flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: var(--radius-sm); background: rgba(6,6,18,0.9); border: 1px solid var(--border2); color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer; transition: var(--transition); backdrop-filter: blur(16px); }
#detail-back:hover { background: var(--surface2); color: var(--violet-light); }
.dp-hero { width: 100%; height: 360px; position: relative; overflow: hidden; }
.dp-hero canvas { width: 100%; height: 100%; display: block; }
.dp-hero-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(6,6,18,0.3) 0%, rgba(6,6,18,0.95) 100%); display: flex; flex-direction: column; justify-content: flex-end; padding: 40px; }
.dp-name { font-family: var(--font-head); font-size: clamp(32px, 5vw, 56px); font-weight: 800; letter-spacing: -0.03em; color: #fff; }
.dp-body { max-width: 960px; margin: 0 auto; padding: 48px 32px 80px; }
.dp-description { font-size: 17px; color: var(--text2); line-height: 1.7; margin-bottom: 36px; }
.dp-pricing { background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius-lg); padding: 28px 32px; margin-bottom: 48px; display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
.dp-monthly { font-family: var(--font-mono); font-size: 48px; font-weight: 700; color: #fff; }
.dp-monthly-label { font-size: 13px; color: var(--text3); margin-top: 4px; }
.dp-setup { text-align: right; }
.dp-setup-fee { font-family: var(--font-mono); font-size: 22px; font-weight: 700; }
.dp-setup-note { font-size: 12px; color: var(--text3); max-width: 220px; margin-top: 6px; line-height: 1.4; }
.dp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 40px; }
.dp-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; }
.dp-card h3 { font-family: var(--font-head); font-size: 15px; font-weight: 700; margin-bottom: 16px; color: var(--text); text-transform: uppercase; letter-spacing: 0.05em; }
.dp-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
.dp-list li { display: flex; align-items: flex-start; gap: 10px; font-size: 14px; color: var(--text2); line-height: 1.5; }
.dp-list li::before { content: '→'; color: var(--violet-light); font-weight: 700; flex-shrink: 0; }
.dp-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.dp-tag { padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface2); border: 1px solid var(--border2); color: var(--text2); }
.dp-book-btn { width: 100%; padding: 18px; font-size: 16px; font-weight: 700; border-radius: var(--radius); border: none; cursor: pointer; background: var(--wa-green); color: #fff; font-family: var(--font-body); transition: var(--transition); }
.dp-book-btn:hover { background: #1da851; transform: translateY(-2px); }

/* ═══════════ FEATURES ═══════════ */
#features { padding: 80px 32px; max-width: 1200px; margin: 0 auto; }
.features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; }
.feature-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px; opacity: 0; transform: translateY(24px); transition: opacity 0.5s, transform 0.5s; }
.feature-card.visible { opacity: 1; transform: translateY(0); }
.feature-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 16px; font-size: 22px; }
.feature-card h3 { font-family: var(--font-head); font-size: 18px; font-weight: 700; margin-bottom: 10px; }
.feature-card p { color: var(--text2); font-size: 14px; line-height: 1.65; }

/* ═══════════ FOUNDER ═══════════ */
#founder-section { padding: 10px 32px 100px; max-width: 900px; margin: 0 auto; }
.founder-card { display: flex; gap: 32px; align-items: center; background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius-lg); padding: 40px; }
.founder-avatar { width: 108px; height: 108px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-head); font-size: 32px; font-weight: 800; color: #fff; background: linear-gradient(135deg, var(--violet), var(--cyan)); overflow: hidden; }
.founder-avatar img { width: 100%; height: 100%; object-fit: cover; }
.founder-name { font-family: var(--font-head); font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 2px; }
.founder-title { font-family: var(--font-mono); font-size: 12px; color: var(--violet-light); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 14px; }
.founder-bio { color: var(--text2); font-size: 14.5px; line-height: 1.7; white-space: pre-line; }

/* ═══════════ BOOKING MODAL ═══════════ */
#booking-overlay { position: fixed; inset: 0; z-index: 4000; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; padding: 24px; }
#booking-overlay.active { display: flex; }
#booking-modal { background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--radius-lg); width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; padding: 36px; position: relative; }
#booking-modal h2 { font-family: var(--font-head); font-size: 26px; font-weight: 800; margin-bottom: 6px; }
.booking-sub { color: var(--text2); font-size: 14px; margin-bottom: 28px; }
.form-group { margin-bottom: 18px; position: relative; }
.form-label { display: block; font-size: 13px; font-weight: 600; color: var(--text2); margin-bottom: 7px; }
.form-label span { color: var(--rose); }
.form-input, .form-select, .form-textarea { width: 100%; padding: 12px 16px; background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); font-family: var(--font-body); font-size: 14px; transition: var(--transition); outline: none; }
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--violet-light); box-shadow: 0 0 0 3px rgba(168,85,247,0.12); }
.form-input.error, .form-select.error, .form-textarea.error { border-color: var(--rose); box-shadow: 0 0 0 3px rgba(244,63,94,0.12); }
.form-select option { background: var(--bg2); }
.form-textarea { resize: vertical; min-height: 100px; }
.field-error { color: var(--rose); font-size: 12px; font-weight: 600; margin-top: 5px; display: none; }
.field-error.show { display: block; }
#form-error { color: var(--rose); font-size: 13px; font-weight: 600; margin-bottom: 14px; display: none; background: rgba(244,63,94,0.08); padding: 10px 14px; border-radius: var(--radius-sm); border: 1px solid rgba(244,63,94,0.2); }
.booking-close { position: absolute; top: 16px; right: 16px; width: 32px; height: 32px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--border); color: var(--text2); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: var(--transition); }
.booking-close:hover { color: var(--text); }
#btn-book-submit { width: 100%; padding: 14px; font-size: 15px; font-weight: 700; border-radius: var(--radius-sm); margin-top: 4px; }
#booking-save-note { text-align: center; font-size: 11px; color: var(--text3); margin-top: 10px; display: none; }
.phone-hint { font-size: 11px; color: var(--text3); margin-top: 4px; }

/* ═══════════ PIN & CEO DASHBOARD ═══════════ */
#pin-overlay { position: fixed; inset: 0; z-index: 5000; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); display: none; align-items: center; justify-content: center; }
#pin-overlay.active { display: flex; }
#pin-modal { background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--radius-lg); padding: 40px 36px; width: 100%; max-width: 380px; text-align: center; position: relative; }
#pin-modal h2 { font-family: var(--font-head); font-size: 24px; font-weight: 800; margin-bottom: 8px; }
#pin-modal p { color: var(--text2); font-size: 14px; margin-bottom: 28px; }
#pin-input { width: 100%; padding: 14px; font-size: 22px; text-align: center; letter-spacing: 0.3em; background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); font-family: var(--font-mono); outline: none; margin-bottom: 14px; transition: var(--transition); }
#pin-input:focus { border-color: var(--violet-light); }
#pin-error { color: var(--rose); font-size: 13px; margin-bottom: 14px; display: none; }
.pin-close { position: absolute; top: 14px; right: 14px; width: 30px; height: 30px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--border); color: var(--text2); font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
#ceo-overlay { position: fixed; inset: 0; z-index: 5000; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); display: none; align-items: center; justify-content: center; padding: 24px; }
#ceo-overlay.active { display: flex; }
#ceo-dashboard { background: var(--bg2); border: 1px solid var(--border2); border-radius: var(--radius-lg); width: 100%; max-width: 920px; max-height: 88vh; overflow-y: auto; position: relative; }
#ceo-header { padding: 28px 32px 0; display: flex; align-items: center; justify-content: space-between; }
#ceo-header h2 { font-family: var(--font-head); font-size: 22px; font-weight: 800; }
.ceo-close { width: 32px; height: 32px; border-radius: 50%; background: var(--surface2); border: 1px solid var(--border); color: var(--text2); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: var(--transition); }
.ceo-close:hover { color: var(--text); }
.ceo-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); padding: 0 32px; margin-top: 0; overflow-x: auto; }
.ceo-tab { padding: 14px 16px; font-size: 13px; font-weight: 600; cursor: pointer; border-bottom: 2px solid transparent; color: var(--text2); transition: var(--transition); background: none; border-top: none; border-left: none; border-right: none; white-space: nowrap; }
.ceo-tab.active { color: var(--violet-light); border-bottom-color: var(--violet-light); }
.ceo-tab-content { padding: 28px 32px; display: none; }
.ceo-tab-content.active { display: block; }
.ceo-note { background: rgba(124,58,237,0.08); border: 1px solid rgba(124,58,237,0.2); border-radius: var(--radius-sm); padding: 14px 16px; font-size: 13px; color: var(--text2); margin-bottom: 24px; line-height: 1.6; }

/* Booking entry */
.booking-entry { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 14px; position: relative; }
.booking-entry-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; flex-wrap: wrap; gap: 8px; }
.booking-client-name { font-weight: 700; font-size: 15px; }
.booking-timestamp { font-size: 11px; color: var(--text3); font-family: var(--font-mono); }
.booking-details { font-size: 13px; color: var(--text2); line-height: 1.7; }
.booking-plan-badge { display: inline-flex; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; margin-bottom: 6px; }
.booking-delete { padding: 5px 12px; border-radius: var(--radius-sm); background: rgba(244,63,94,0.1); border: 1px solid rgba(244,63,94,0.3); color: var(--rose); font-size: 12px; font-weight: 600; cursor: pointer; transition: var(--transition); margin-top: 10px; }
.booking-delete:hover { background: rgba(244,63,94,0.2); }

/* Agent control */
.agent-control-tab-label { font-size: 12px; color: var(--text3); font-family: var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.agent-row { display: flex; flex-direction: column; gap: 12px; padding: 14px 16px; border-radius: var(--radius-sm); border: 1px solid var(--border); margin-bottom: 10px; background: var(--surface); transition: var(--transition); }
.agent-row.disabled { opacity: 0.5; }
.agent-row-top { display: flex; align-items: center; justify-content: space-between; width: 100%; flex-wrap: wrap; gap: 10px; }
.agent-row-left { display: flex; align-items: center; gap: 12px; }
.agent-color-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
.agent-tier-num { font-family: var(--font-mono); font-size: 11px; color: var(--text3); }
.agent-row-name { font-size: 14px; font-weight: 600; color: var(--text); }
.agent-row-right { display: flex; align-items: center; gap: 12px; }
.agent-status-badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; text-transform: uppercase; }
.status-active { background: rgba(16,185,129,0.15); color: var(--emerald); border: 1px solid rgba(16,185,129,0.3); }
.status-hidden { background: rgba(90,90,122,0.15); color: var(--text3); border: 1px solid rgba(90,90,122,0.3); }
.agent-row-pricing { display: flex; align-items: flex-end; gap: 10px; flex-wrap: wrap; padding-top: 12px; border-top: 1px solid var(--border); }
.agent-price-field { display: flex; flex-direction: column; gap: 4px; }
.agent-price-field label { font-size: 10px; font-family: var(--font-mono); color: var(--text3); text-transform: uppercase; }
.agent-price-input { background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); font-family: var(--font-mono); font-size: 13px; padding: 7px 10px; width: 120px; }
.agent-price-input:focus { outline: none; border-color: var(--violet-light); }
.agent-price-reset { background: none; border: 1px solid var(--border2); border-radius: var(--radius-sm); color: var(--text3); font-family: var(--font-body); font-size: 11px; font-weight: 600; padding: 8px 12px; cursor: pointer; transition: var(--transition); }
.agent-price-reset:hover { color: var(--text); border-color: var(--violet-light); }
.agent-price-saved-note { font-size: 11px; color: var(--emerald); font-family: var(--font-mono); font-weight: 600; opacity: 0; transition: opacity 0.3s; }
.agent-price-saved-note.show { opacity: 1; }

/* Toggle */
.toggle-switch { position: relative; width: 44px; height: 24px; flex-shrink: 0; }
.toggle-switch input { opacity: 0; width: 0; height: 0; }
.toggle-slider { position: absolute; cursor: pointer; inset: 0; background: rgba(255,255,255,0.1); border-radius: 12px; transition: 0.3s; }
.toggle-slider::before { content: ''; position: absolute; height: 18px; width: 18px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: 0.3s; }
input:checked + .toggle-slider { background: var(--violet); }
input:checked + .toggle-slider::before { transform: translateX(20px); }

/* Settings */
.settings-group { margin-bottom: 30px; padding-bottom: 26px; border-bottom: 1px solid var(--border); }
.settings-group:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
.settings-group h4 { font-family: var(--font-head); font-size: 15px; font-weight: 700; margin-bottom: 6px; color: var(--text); }
.settings-group-desc { font-size: 12px; color: var(--text3); line-height: 1.6; margin-bottom: 16px; }
.settings-toggle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.settings-toggle-row .form-label { margin-bottom: 0; }
.settings-file-input { width: 100%; padding: 10px; background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius-sm); color: var(--text2); font-size: 13px; margin-bottom: 12px; }
.settings-actions-row { display: flex; gap: 10px; flex-wrap: wrap; }
.color-field-row { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 18px; }
.color-field-row label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--text2); font-weight: 600; }
.color-field-row input[type=color] { width: 52px; height: 36px; border-radius: 8px; border: 1px solid var(--border2); background: none; cursor: pointer; padding: 2px; }
.theme-preset-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; max-height: 300px; overflow-y: auto; padding: 8px; background: var(--surface); border-radius: var(--radius-sm); border: 1px solid var(--border); }
.theme-preset-swatch { display: flex; align-items: center; gap: 6px; padding: 5px 10px 5px 5px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border2); color: var(--text2); font-size: 11px; font-weight: 600; cursor: pointer; transition: var(--transition); white-space: nowrap; }
.theme-preset-swatch:hover { background: var(--surface2); border-color: var(--violet-light); color: var(--text); }
.theme-preset-dot { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(255,255,255,0.2); }

/* View mode / anim mode */
.anim-preview-btn { flex: 1; min-width: 140px; padding: 12px; border-radius: var(--radius-sm); border: 1px solid var(--border2); background: var(--surface); color: var(--text2); font-family: var(--font-body); font-size: 13px; font-weight: 600; cursor: pointer; transition: var(--transition); text-align: center; }
.anim-preview-btn.selected { background: rgba(124,58,237,0.15); color: var(--violet-light); border-color: var(--violet); }
.anim-preview-btn:hover { background: var(--surface2); }
.view-mode-btn { flex: 1; padding: 10px; border-radius: var(--radius-sm); border: 1px solid var(--border2); background: var(--surface); color: var(--text2); font-family: var(--font-body); font-size: 13px; font-weight: 600; cursor: pointer; transition: var(--transition); text-align: center; }
.view-mode-btn.active { background: rgba(6,182,212,0.15); color: var(--cyan); border-color: var(--cyan); }

/* Custom animation injector */
.anim-code-area { width: 100%; min-height: 140px; background: var(--bg); border: 1px solid var(--border2); border-radius: var(--radius-sm); color: var(--cyan); font-family: var(--font-mono); font-size: 12px; padding: 12px; resize: vertical; outline: none; transition: var(--transition); }
.anim-code-area:focus { border-color: var(--violet-light); }

/* WA settings */
.wa-number-field { position: relative; }
.wa-number-field input { padding-left: 52px; }
.wa-country-code { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-family: var(--font-mono); font-size: 13px; color: var(--violet-light); font-weight: 700; pointer-events: none; }

/* ═══════════ FOOTER ═══════════ */
footer { border-top: 1px solid var(--border); padding: 48px 32px; text-align: center; position: relative; z-index: 1; }
.footer-logo { font-family: var(--font-head); font-size: 20px; font-weight: 800; background: linear-gradient(135deg, var(--violet-light), var(--cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 20px; display: inline-block; }
.footer-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 24px; }
.footer-links a { color: var(--text3); text-decoration: none; font-size: 13px; font-weight: 500; padding: 6px 14px; border-radius: var(--radius-sm); transition: var(--transition); }
.footer-links a:hover { color: var(--text); background: var(--surface2); }
.footer-copy { font-size: 12px; color: var(--text3); }
.footer-copy a { color: var(--violet-light); text-decoration: none; cursor: pointer; }

/* ═══════════ TOAST ═══════════ */
#toast { position: fixed; bottom: 32px; right: 32px; z-index: 9000; background: var(--bg2); border: 1px solid var(--emerald); border-radius: var(--radius); padding: 16px 20px; display: flex; align-items: center; gap: 12px; transform: translateY(100px); opacity: 0; transition: var(--transition); min-width: 300px; max-width: 400px; }
#toast.show { transform: translateY(0); opacity: 1; }
#toast.error-toast { border-color: var(--rose); }
#toast .toast-icon { font-size: 20px; }
#toast .toast-msg { font-size: 14px; color: var(--text); font-weight: 600; }

/* ═══════════ SUPABASE STATUS ═══════════ */
.supabase-status { display: flex; align-items: center; gap: 8px; font-size: 12px; font-family: var(--font-mono); }
.supabase-dot { width: 8px; height: 8px; border-radius: 50%; }
.supabase-dot.connected { background: var(--emerald); box-shadow: 0 0 6px var(--emerald); }
.supabase-dot.disconnected { background: var(--rose); }
.supabase-dot.pending { background: var(--amber); animation: pulse-dot 1.5s ease-in-out infinite; }

/* ═══════════ VISITOR STATS ═══════════ */
.visitor-stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 24px; }
.visitor-stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; text-align: center; }
.visitor-stat-number { font-family: var(--font-head); font-size: 28px; font-weight: 800; color: var(--violet-light); }
.visitor-stat-label { font-size: 12px; color: var(--text3); margin-top: 4px; font-family: var(--font-mono); }
.daily-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.daily-table th, .daily-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
.daily-table th { color: var(--text3); font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
.daily-table td { color: var(--text2); }
.daily-table tr:hover td { background: var(--surface); }
